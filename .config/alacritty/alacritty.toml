# [mouse.hints]
# modifiers = "Command"

# [mouse.hints.launcher]
# program = "open"

[selection]
save_to_clipboard = true

[colors.primary]
foreground = "#cccccc"
background = "#000000"

[colors.normal]
black = "#000000"
red = "#cd0000"
green = "#00cd00"
yellow = "#cdcd00"
blue = "#0000ee"
magenta = "#cd00cd"
cyan = "#00cdcd"
white = "#e5e5e5"

[colors.bright]
black = "#808080"
red = "#ff0000"
green = "#00ff00"
yellow = "#ffff00"
blue = "#5c5cff"
magenta = "#ff00ff"
cyan = "#00ffff"
white = "#ffffff"
